spring.application.name=tienda-tresde.back
server.port=${PORT:8080}
# Respeta X-Forwarded-* cuando corre detrás de un proxy (Render, Railway, etc.)
server.forward-headers-strategy=framework

# ── Base de datos ──
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tresde}
spring.datasource.username=${DB_USER:tresde}
spring.datasource.password=${DB_PASSWORD:tresde}
# Pocas conexiones: el pooler de Supabase (plan gratuito) admite un número limitado
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# El esquema lo maneja Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ── Subida de imágenes ──
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── Configuración de la tienda ──
# Orígenes que pueden llamar a la API (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://tresde-creation.vercel.app}
# Clave para firmar los tokens: mínimo 32 caracteres. CÁMBIALA en producción.
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-cambiala-en-produccion-123456}
app.jwt.expiration-hours=8
# Usuario administrador inicial (se crea solo si no existe ningún usuario)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
app.admin.name=${ADMIN_NAME:Administrador}
